[package]
name = "esp32-c3-super-mini-rust"
authors = ["Petr Gadorek <hahihula@gmail.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
esp-backtrace = { version = "0.15", features = ["esp32c3", "panic-handler", "exception-handler","println"] }
esp-println = { version = "0.13", default-features = false, features = ["esp32c3", "uart"] }
esp-hal = { version = "1.0.0-rc.0", package = "esp-hal" , features = [
   "esp32c3",
   "unstable",
   "__esp_hal_embassy"
]}
esp-hal-embassy = { version = "0.8.0", features=["esp32c3"] }
embassy-executor    = { version = "0.7" }
embassy-sync              = { version = "0.6" }
embassy-time              = { version = "0.4" }
embassy-time-driver       = { version = "0.2", features = [ "tick-hz-1_000_000" ] }
embassy-time-queue-utils  = { version = "0.1", features = ["_generic-queue"] }
smoltcp = { version = "0.12", default-features=false, features = [ "proto-ipv4", "socket-tcp", "socket-icmp", "socket-udp", "medium-ethernet", "proto-dhcpv4", "socket-raw", "socket-dhcpv4"] }
critical-section = "1.2"
esp-bootloader-esp-idf = { version="0.5", features=["esp32c3"]}